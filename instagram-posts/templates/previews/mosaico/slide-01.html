<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="slide-size" content="1080x1350">
<link href="https://fonts.googleapis.com/css2?family=Aleo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Halimun'; src: url('../../../assets/fonts/halimun.ttf') format('truetype'); font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #fff; }
  .slide { width: 1080px; height: 1350px; overflow: hidden; background: #fff; padding: 14px; display: grid; grid-template-columns: 1.12fr .88fr; grid-template-rows: .9fr 1.1fr; gap: 14px; }

  .cel { position: relative; overflow: hidden; }
  .cel img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.75); }

  /* A célula da frase: azul da casa, com a assinatura no pé. */
  .frase { background: #002e5a; color: #fff; padding: 60px 56px; display: flex; flex-direction: column; }
  .fio { width: 56px; height: 3px; background: #f9a4cf; margin-bottom: 34px; }
  blockquote { font-family: 'Aleo', serif; font-weight: 500; font-size: 48px; line-height: 1.16; letter-spacing: -0.015em; text-wrap: balance; }
  cite { display: block; margin-top: 26px; font-family: 'Archivo', sans-serif; font-style: normal; font-size: 21px; color: #f9a4cf; }
  .assinatura { margin-top: auto; font-family: 'Archivo', sans-serif; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; font-size: 15px; line-height: 1.6; color: rgba(255,255,255,.72); }

  /* Assinatura em Halimun (BRAND.md): duas linhas, entrelinha compacta, sem quebra dentro da linha. */
  .assinatura { font-family: 'Halimun', cursive; font-weight: 400; font-size: 29px; line-height: 1.55; letter-spacing: 0; text-transform: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="slide">
  <div class="cel"><img src="../../../../public/images/evangelho-rosas.jpg" alt="" style="object-position: 34% 90%"></div>
  <div class="cel"><img src="../../../../public/images/maos-dadas.jpg" alt="" style="object-position: 52% 88%"></div>
  <div class="cel frase">
    <div class="fio"></div>
    <blockquote>Bem-aventurados os pacificadores, porque serão chamados filhos de Deus.</blockquote>
    <cite>Jesus · Mateus 5:9</cite>
    <div class="assinatura">Morada Espírita<br>Professor Lairi Hans</div>
  </div>
  <div class="cel"><img src="../../../../public/images/desenhos-das-criancas.jpg" alt="" style="object-position: 40% 60%"></div>
</div>
</body>
</html>
