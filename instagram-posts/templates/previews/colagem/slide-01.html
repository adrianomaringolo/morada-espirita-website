<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="slide-size" content="1080x1350">
<link href="https://fonts.googleapis.com/css2?family=Aleo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Halimun'; src: url('../../../assets/fonts/halimun.ttf') format('truetype'); font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #f6ecf0; }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #f6ecf0; }

  /* Uma fotografia impressa, com margem branca, levemente torta sobre a mesa. */
  .copia { position: absolute; left: 92px; top: 96px; width: 700px; padding: 26px 26px 92px; background: #fff; transform: rotate(-2.4deg); box-shadow: 0 30px 60px -24px rgba(130,16,79,.28), 0 2px 6px rgba(39,25,34,.08); }
  .copia img { display: block; width: 100%; height: 760px; object-fit: cover; object-position: 50% 50%; filter: saturate(.8); }

  /* O cartão com a frase entra por cima da cópia, deslocado para a direita. */
  .cartao { position: absolute; left: 330px; right: 80px; top: 780px; padding: 64px 64px 60px; background: #fff; border-top: 4px solid #e652a3; box-shadow: 0 24px 48px -28px rgba(39,25,34,.3); }
  blockquote { font-family: 'Aleo', serif; font-weight: 500; font-size: 54px; line-height: 1.16; letter-spacing: -0.015em; color: #271922; text-wrap: balance; }
  cite { display: block; margin-top: 28px; font-family: 'Archivo', sans-serif; font-style: normal; font-size: 23px; letter-spacing: .03em; color: #a01560; }

  /* Assinatura no canto inferior esquerdo, livre abaixo da cópia. */
  .assinatura { position: absolute; left: 50px; bottom: 76px; writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Archivo', sans-serif; font-weight: 500; font-size: 17px; letter-spacing: .2em; text-transform: uppercase; color: #6d5d67; }

  /* Assinatura em Halimun (BRAND.md): duas linhas, entrelinha compacta, sem quebra dentro da linha. */
  .assinatura { font-family: 'Halimun', cursive; font-weight: 400; font-size: 38px; line-height: 1.55; letter-spacing: 0; text-transform: none; white-space: nowrap; }
  .assinatura { writing-mode: horizontal-tb; transform: none; left: 76px; bottom: 70px; }
</style>
</head>
<body>
<div class="slide">
  <div class="copia"><img src="../../../../public/images/evangelho-jesus.jpg" alt=""></div>
  <div class="cartao">
    <blockquote>Amai-vos uns aos outros, como eu vos amei.</blockquote>
    <cite>Jesus · João 13:34</cite>
  </div>
  <div class="assinatura">Morada Espírita<br>Professor Lairi Hans</div>
</div>
</body>
</html>
