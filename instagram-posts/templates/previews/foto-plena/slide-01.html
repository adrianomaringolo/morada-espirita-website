<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="slide-size" content="1080x1350">
<link href="https://fonts.googleapis.com/css2?family=Aleo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Halimun'; src: url('../../../assets/fonts/halimun.ttf') format('truetype'); font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #1d1418; }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #1d1418; }

  .foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 55% 40%; filter: saturate(.72); }
  .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(29,20,24,.88) 0%, rgba(29,20,24,.62) 30%, rgba(29,20,24,0) 54%, rgba(29,20,24,0) 82%, rgba(29,20,24,.55) 100%); }

  .texto { position: absolute; left: 96px; right: 130px; top: 104px; color: #fff; }
  .fio { width: 64px; height: 3px; background: #f9a4cf; margin-bottom: 44px; }
  blockquote { font-family: 'Aleo', serif; font-weight: 500; font-size: 74px; line-height: 1.12; letter-spacing: -0.02em; text-wrap: balance; }
  cite { display: block; margin-top: 36px; font-family: 'Archivo', sans-serif; font-style: normal; font-size: 26px; letter-spacing: .03em; color: #f9a4cf; }

  .assinatura { position: absolute; left: 96px; bottom: 88px; font-family: 'Archivo', sans-serif; font-weight: 500; font-size: 19px; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.72); }

  /* Assinatura em Halimun (BRAND.md): duas linhas, entrelinha compacta, sem quebra dentro da linha. */
  .assinatura { font-family: 'Halimun', cursive; font-weight: 400; font-size: 38px; line-height: 1.55; letter-spacing: 0; text-transform: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="slide">
  <img class="foto" src="../../../../public/images/maos-dadas.jpg" alt="">
  <div class="scrim"></div>
  <div class="texto">
    <div class="fio"></div>
    <blockquote>Bem-aventurados os que choram, porque serão consolados.</blockquote>
    <cite>Jesus · Mateus 5:4</cite>
  </div>
  <div class="assinatura">Morada Espírita<br>Professor Lairi Hans</div>
</div>
</body>
</html>
