<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="slide-size" content="1080x1350">
<link href="https://fonts.googleapis.com/css2?family=Aleo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Halimun'; src: url('../../../assets/fonts/halimun.ttf') format('truetype'); font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #fcf5f8; }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #fcf5f8; padding: 92px 104px 0; }

  /* Cabeçalho corrido de livro: obra à esquerda, capítulo à direita. */
  .corrido { display: flex; justify-content: space-between; padding-bottom: 22px; border-bottom: 1px solid #e5dade; font-family: 'Archivo', sans-serif; font-weight: 500; font-size: 20px; letter-spacing: .14em; text-transform: uppercase; color: #6d5d67; }

  /* Prancha: a foto entra como ilustração de página, com legenda. */
  .prancha { margin-top: 60px; height: 450px; overflow: hidden; }
  .prancha img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 62%; filter: saturate(.7); }
  .legenda { margin-top: 14px; font-family: 'Archivo', sans-serif; font-size: 18px; color: #6d5d67; }

  .texto { margin-top: 64px; font-family: 'Aleo', serif; font-weight: 400; font-size: 52px; line-height: 1.34; color: #271922; hanging-punctuation: first; }
  .texto::first-letter { float: left; font-weight: 700; font-size: 186px; line-height: .8; margin: 10px 18px 0 -4px; color: #a01560; }

  .rodape { position: absolute; left: 104px; right: 104px; bottom: 76px; display: flex; align-items: center; gap: 28px; font-family: 'Archivo', sans-serif; font-weight: 500; font-size: 17px; letter-spacing: .2em; text-transform: uppercase; color: #6d5d67; }
  .rodape::before, .rodape::after { content: ''; flex: 1; height: 1px; background: #e5dade; }

  /* Assinatura em Halimun (BRAND.md): duas linhas, entrelinha compacta, sem quebra dentro da linha. */
  .rodape { font-family: 'Halimun', cursive; font-weight: 400; font-size: 38px; line-height: 1.55; letter-spacing: 0; text-transform: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="slide">
  <div class="corrido"><span>O Evangelho segundo o Espiritismo</span><span>Cap. XVII · 4</span></div>
  <div class="prancha"><img src="../../../../public/images/maos-dadas.jpg" alt=""></div>
  <p class="legenda">Sede perfeitos</p>
  <p class="texto">Reconhece-se o verdadeiro espírita pela sua transformação moral e pelos esforços que emprega para domar suas más inclinações.</p>
  <div class="rodape">Morada Espírita<br>Professor Lairi Hans</div>
</div>
</body>
</html>
