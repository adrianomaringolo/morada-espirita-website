<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="slide-size" content="1080x1350">
<link href="https://fonts.googleapis.com/css2?family=Aleo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Halimun'; src: url('../../../assets/fonts/halimun.ttf') format('truetype'); font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #fcf8f7; }
  /* Fundo de papel suave (asset compartilhado): base branco-rosado com grão e fibras. */
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; text-align: center;
    background: #fcf8f7 url('../../../assets/images/papel.svg') center / cover no-repeat; }

  .eyebrow { position: absolute; left: 0; right: 0; top: 300px; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: .2em; text-transform: uppercase; color: #a01560; }

  /* A palavra é a janela: a foto só aparece por dentro das letras. */
  .palavra {
    position: absolute; margin-top: -.32em; left: 0; right: 0; top: 380px;
    font-family: 'Aleo', serif; font-weight: 700; font-size: 272px; line-height: 1; padding: 0.32em 0; letter-spacing: -0.035em;
    background: linear-gradient(rgba(0,46,90,.62), rgba(0,46,90,.62)), url('../../../../public/images/campo-de-rosas.jpg') 50% 62% / 1500px auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  blockquote { position: absolute; left: 150px; right: 150px; top: 826px; font-family: 'Aleo', serif; font-style: italic; font-weight: 400; font-size: 50px; line-height: 1.24; color: #271922; text-wrap: balance; }
  cite { position: absolute; left: 0; right: 0; top: 980px; font-family: 'Archivo', sans-serif; font-style: normal; font-size: 23px; letter-spacing: .03em; color: #6d5d67; }

  .assinatura { position: absolute; left: 0; right: 0; bottom: 80px; font-family: 'Archivo', sans-serif; font-weight: 500; font-size: 18px; letter-spacing: .2em; text-transform: uppercase; color: #6d5d67; }

  /* Assinatura em Halimun (BRAND.md): duas linhas, entrelinha compacta, sem quebra dentro da linha. */
  .assinatura { font-family: 'Halimun', cursive; font-weight: 400; font-size: 38px; line-height: 1.55; letter-spacing: 0; text-transform: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="slide">
  <div class="eyebrow">Uma palavra para hoje</div>
  <div class="palavra">Perdão</div>
  <blockquote>Perdoai, para que Deus vos perdoe.</blockquote>
  <cite>O Evangelho segundo o Espiritismo, cap. X</cite>
  <div class="assinatura">Morada Espírita<br>Professor Lairi Hans</div>
</div>
</body>
</html>
