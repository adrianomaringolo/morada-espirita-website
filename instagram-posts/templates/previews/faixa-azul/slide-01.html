<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="slide-size" content="1080x1350">
<link href="https://fonts.googleapis.com/css2?family=Aleo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Halimun'; src: url('../../../assets/fonts/halimun.ttf') format('truetype'); font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #002e5a; }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #002e5a; }

  /* Ondas de uma pedra na água: a "imagem" deste template é desenhada, não fotografada. */
  .ondas { position: absolute; right: -260px; bottom: -260px; width: 820px; height: 820px; }
  .ondas span { position: absolute; inset: 0; margin: auto; border-radius: 50%; border: 1.5px solid rgba(249,164,207,.28); }
  .ondas span:nth-child(1) { width: 180px; height: 180px; border-color: rgba(249,164,207,.6); }
  .ondas span:nth-child(2) { width: 360px; height: 360px; border-color: rgba(249,164,207,.42); }
  .ondas span:nth-child(3) { width: 560px; height: 560px; }
  .ondas span:nth-child(4) { width: 800px; height: 800px; border-color: rgba(249,164,207,.16); }

  /* Videira em traço branco (asset compartilhado), entrando pela borda superior direita. */
  .videira { position: absolute; right: -90px; top: -40px; width: 760px; opacity: .92; }

  .aspas { position: absolute; left: 82px; top: 240px; font-family: 'Aleo', serif; font-weight: 700; font-size: 340px; line-height: 1; color: #f9a4cf; }
  blockquote { position: absolute; left: 96px; right: 140px; top: 530px; font-family: 'Aleo', serif; font-weight: 600; font-size: 112px; line-height: 1.04; letter-spacing: -0.025em; color: #fff; text-wrap: balance; }
  cite { position: absolute; left: 96px; top: 850px; font-family: 'Archivo', sans-serif; font-style: normal; font-size: 26px; letter-spacing: .03em; color: #f9a4cf; }

  .assinatura { position: absolute; left: 96px; bottom: 84px; font-family: 'Archivo', sans-serif; font-weight: 500; font-size: 18px; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.7); }

  /* Assinatura em Halimun (BRAND.md): duas linhas, entrelinha compacta, sem quebra dentro da linha. */
  .assinatura { font-family: 'Halimun', cursive; font-weight: 400; font-size: 38px; line-height: 1.55; letter-spacing: 0; text-transform: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="slide">
  <div class="ondas"><span></span><span></span><span></span><span></span></div>
  <img class="videira" src="../../../assets/images/videira-branca.png" alt="">
  <div class="aspas">“</div>
  <blockquote>Fora da caridade não há salvação.</blockquote>
  <cite>O Evangelho segundo o Espiritismo, cap. XV</cite>
  <div class="assinatura">Morada Espírita<br>Professor Lairi Hans</div>
</div>
</body>
</html>
