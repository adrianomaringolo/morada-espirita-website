<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="slide-size" content="1080x1350">
<link href="https://fonts.googleapis.com/css2?family=Aleo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Halimun'; src: url('../../../assets/fonts/halimun.ttf') format('truetype'); font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #fcf5f8; }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #fcf5f8; }

  /* A janela em arco: a foto vive dentro dela. O contorno rosa deslocado dá profundidade. */
  .arco, .contorno { position: absolute; left: 50%; top: 104px; width: 580px; height: 700px; border-radius: 290px 290px 4px 4px; }
  .contorno { transform: translateX(calc(-50% + 26px)); top: 130px; border: 2px solid #e652a3; }
  .arco { transform: translateX(-50%); overflow: hidden; background: #f6ecf0; }
  .arco img { width: 100%; height: 100%; object-fit: cover; object-position: 60% 50%; filter: saturate(.82); }

  .texto { position: absolute; left: 130px; right: 130px; top: 896px; text-align: center; }
  blockquote { font-family: 'Aleo', serif; font-style: italic; font-weight: 400; font-size: 46px; line-height: 1.3; color: #271922; text-wrap: balance; }
  cite { display: block; margin-top: 30px; font-family: 'Archivo', sans-serif; font-style: normal; font-size: 23px; letter-spacing: .03em; color: #a01560; }

  .assinatura { position: absolute; left: 0; right: 0; bottom: 74px; text-align: center; font-family: 'Archivo', sans-serif; font-weight: 500; font-size: 18px; letter-spacing: .2em; text-transform: uppercase; color: #6d5d67; }

  /* Assinatura em Halimun (BRAND.md): duas linhas, entrelinha compacta, sem quebra dentro da linha. */
  .assinatura { font-family: 'Halimun', cursive; font-weight: 400; font-size: 38px; line-height: 1.55; letter-spacing: 0; text-transform: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="slide">
  <div class="contorno"></div>
  <div class="arco"><img src="../../../../public/images/evangelho-rosas.jpg" alt=""></div>
  <div class="texto">
    <blockquote>Espíritas! amai-vos, este o primeiro ensinamento; instruí-vos, este o segundo.</blockquote>
    <cite>O Espírito de Verdade · O Evangelho segundo o Espiritismo, cap. VI</cite>
  </div>
  <div class="assinatura">Morada Espírita<br>Professor Lairi Hans</div>
</div>
</body>
</html>
