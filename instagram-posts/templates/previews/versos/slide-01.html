<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="slide-size" content="1080x1350">
<link href="https://fonts.googleapis.com/css2?family=Aleo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Halimun'; src: url('../../../assets/fonts/halimun.ttf') format('truetype'); font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #fdf0f5; }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #fdf0f5; text-align: center; }

  .foto { position: absolute; left: 50%; top: 140px; width: 170px; height: 220px; margin-left: -85px; overflow: hidden; border-radius: 4px; }
  .foto img { width: 100%; height: 100%; object-fit: cover; object-position: 40% 85%; filter: saturate(.8); }

  /* Rosas de Redouté (domínio público) nos cantos: entram pela borda, nunca atrás do texto. */
  .flor { position: absolute; pointer-events: none; }
  .flor-alto { right: -110px; top: -70px; width: 430px; transform: rotate(-18deg); }
  .flor-baixo { left: -120px; bottom: -150px; width: 380px; transform: scaleX(-1) rotate(-14deg); }

  .titulo { position: absolute; left: 0; right: 0; top: 330px; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 21px; letter-spacing: .2em; text-transform: uppercase; color: #a01560; }

  /* Um verso por linha, com um ponto rosa entre eles: lê-se devagar, como prece. */
  .versos { position: absolute; left: 110px; right: 100px; top: 408px; list-style: none; }
  .versos li { font-family: 'Aleo', serif; font-weight: 400; font-size: 47px; line-height: 1.24; color: #271922; text-wrap: balance; }
  .versos li + li::before { content: ''; display: block; width: 7px; height: 7px; margin: 26px auto; border-radius: 50%; background: #e652a3; }

  cite { position: absolute; left: 0; right: 0; top: 1040px; font-family: 'Archivo', sans-serif; font-style: normal; font-size: 22px; color: #6d5d67; }
  .assinatura { position: absolute; left: 0; right: 0; bottom: 74px; font-family: 'Archivo', sans-serif; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; font-size: 17px; color: #6d5d67; }

  /* Assinatura em Halimun (BRAND.md): duas linhas, entrelinha compacta, sem quebra dentro da linha. */
  .assinatura { font-family: 'Halimun', cursive; font-weight: 400; font-size: 38px; line-height: 1.55; letter-spacing: 0; text-transform: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="slide">
  <img class="flor flor-alto" src="../../../assets/images/rosa-centifolia-redoute.png" alt="">
  <img class="flor flor-baixo" src="../../../assets/images/rosa-gallica-redoute.png" alt="">
  <div class="titulo">Prece de Cáritas</div>
  <ul class="versos">
    <li>Deus, nosso Pai, que sois todo poder e bondade,</li>
    <li>dai a força àquele que passa pela provação,</li>
    <li>dai a luz àquele que procura a verdade,</li>
    <li>ponde no coração do homem a compaixão e a caridade.</li>
  </ul>
  <cite>Trecho da Prece de Cáritas</cite>
  <div class="assinatura">Morada Espírita<br>Professor Lairi Hans</div>
</div>
</body>
</html>
