<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="slide-size" content="1080x1350">
<link href="https://fonts.googleapis.com/css2?family=Aleo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Halimun'; src: url('../../../assets/fonts/halimun.ttf') format('truetype'); font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #271922; }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #271922; }

  /* A foto como uma lua: círculo grande que sai pelo canto, com um anel fino ao redor. */
  .lua, .anel { position: absolute; border-radius: 50%; }
  .lua { right: -170px; top: -150px; width: 820px; height: 820px; overflow: hidden; }
  .lua img { width: 100%; height: 100%; object-fit: cover; object-position: 60% 70%; filter: saturate(.8); }
  .anel { right: -214px; top: -194px; width: 908px; height: 908px; border: 1.5px solid rgba(249,164,207,.5); }

  .texto { position: absolute; left: 96px; right: 150px; bottom: 250px; color: #fff; }
  .eyebrow { font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 21px; letter-spacing: .18em; text-transform: uppercase; color: #f9a4cf; margin-bottom: 30px; }
  blockquote { font-family: 'Aleo', serif; font-weight: 500; font-size: 66px; line-height: 1.14; letter-spacing: -0.02em; text-wrap: balance; }
  cite { display: block; margin-top: 32px; font-family: 'Archivo', sans-serif; font-style: normal; font-size: 24px; color: #f9a4cf; }

  .nb { white-space: nowrap; }
  .assinatura { position: absolute; left: 96px; bottom: 88px; font-family: 'Archivo', sans-serif; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; font-size: 18px; color: rgba(255,255,255,.66); }

  /* Assinatura em Halimun (BRAND.md): duas linhas, entrelinha compacta, sem quebra dentro da linha. */
  .assinatura { font-family: 'Halimun', cursive; font-weight: 400; font-size: 38px; line-height: 1.55; letter-spacing: 0; text-transform: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="slide">
  <div class="anel"></div>
  <div class="lua"><img src="../../../../public/images/evangelho-jesus.jpg" alt=""></div>
  <div class="texto">
    <div class="eyebrow">Antes de dormir</div>
    <blockquote>Pedi, e <span class="nb">dar-se-vos-á</span>; buscai, e achareis; batei, e <span class="nb">abrir-se-vos-á</span>.</blockquote>
    <cite>Jesus · Mateus 7:7</cite>
  </div>
  <div class="assinatura">Morada Espírita<br>Professor Lairi Hans</div>
</div>
</body>
</html>
