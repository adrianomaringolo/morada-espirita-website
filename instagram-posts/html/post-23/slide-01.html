<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="slide-size" content="1080x1350">
<link href="https://fonts.googleapis.com/css2?family=Aleo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Halimun'; src: url('../../assets/fonts/halimun.ttf') format('truetype'); font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #fff; }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #fff; display: grid; grid-template-columns: 440px 1fr; }

  .foto { position: relative; overflow: hidden; }
  .foto img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; filter: saturate(.85); }

  .lado { position: relative; padding: 0 84px 140px 76px; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 20px; letter-spacing: .16em; text-transform: uppercase; color: #a01560; }
  .apoio { margin-top: 58px; font-family: 'Archivo', sans-serif; font-size: 27px; line-height: 1.45; color: #6d5d67; }
  blockquote { margin-top: 40px; font-family: 'Aleo', serif; font-weight: 500; font-size: 62px; line-height: 1.18; letter-spacing: -0.015em; color: #002e5a; text-wrap: balance; }
  .nb { white-space: nowrap; }
  cite { display: block; margin-top: 34px; padding-top: 24px; border-top: 1px solid #e5dade; font-family: 'Archivo', sans-serif; font-style: normal; font-size: 22px; color: #6d5d67; }

  /* Referência em destaque; a versão bíblica fica na linha de baixo, no tamanho de antes. */
  cite .ref { display: block; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 34px; letter-spacing: .01em; color: #a01560; }
  cite .versao { display: block; margin-top: 6px; font-size: 22px; color: #6d5d67; }
  .assinatura { position: absolute; left: 76px; right: 60px; bottom: 76px; font-family: 'Archivo', sans-serif; font-weight: 500; font-size: 16px; letter-spacing: .2em; text-transform: uppercase; color: #6d5d67; }

  /* Assinatura em Halimun (BRAND.md): duas linhas, entrelinha compacta, sem quebra dentro da linha. */
  .assinatura { font-family: 'Halimun', cursive; font-weight: 400; font-size: 29px; line-height: 1.55; letter-spacing: 0; text-transform: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="slide">
  <div class="foto"><img src="bg.jpg" alt=""></div>
  <div class="lado">
    <div class="eyebrow">Palavras de Jesus</div>
    <blockquote>“Sigam-me, e eu os farei pescadores de homens.”</blockquote>
    <cite><span class="ref">Mateus 4.19</span><span class="versao">Nova Versão Internacional</span></cite>
    <div class="assinatura">Morada Espírita<br>Professor Lairi Hans</div>
  </div>
</div>
</body>
</html>
