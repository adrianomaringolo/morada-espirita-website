<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="slide-size" content="1080x1350">
<link href="https://fonts.googleapis.com/css2?family=Aleo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Halimun'; src: url('../../assets/fonts/halimun.ttf') format('truetype'); font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #6d5d67; }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #6d5d67; }

  /* A foto com a cor natural, só um pouco dessaturada: nada de camada colorida por cima. */
  .foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; filter: saturate(.8); }

  /* O vidro: faixa branca translúcida que desfoca só o que está atrás da frase. */
  .vidro {
    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    padding: 80px 120px 68px;
    background: rgba(255,255,255,.7);
    -webkit-backdrop-filter: blur(22px) saturate(1.1); backdrop-filter: blur(22px) saturate(1.1);
    border-top: 1.5px solid rgba(255,255,255,.85); border-bottom: 1.5px solid rgba(255,255,255,.85);
    box-shadow: 0 30px 70px -30px rgba(39,25,34,.35);
    text-align: center; color: #271922;
  }
  blockquote { font-family: 'Aleo', serif; font-weight: 500; font-size: 50px; line-height: 1.16; letter-spacing: -0.02em; text-wrap: balance; }
  .nb { white-space: nowrap; }
  cite { display: block; margin-top: 36px; font-style: normal; }
  /* Autor espiritual em destaque; médium e obra na linha de baixo, menores. */
  cite .autor { display: block; font-family: 'Aleo', serif; font-weight: 600; font-size: 40px; letter-spacing: -0.01em; color: #a01560; }
  cite .obra { display: block; margin-top: 10px; font-family: 'Archivo', sans-serif; font-size: 28px; line-height: 1.35; letter-spacing: .02em; color: #4f3f49; }

  /* Assinatura em Halimun (BRAND.md): duas linhas, entrelinha compacta, sem quebra dentro da linha. */
  /* Assinatura fora do vidro, no pé do post, sobre a foto: branca com sombra suave (sem camada sobre a foto). */
  .assinatura { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.45), 0 0 18px rgba(0,0,0,.55); }
  .assinatura { font-family: 'Halimun', cursive; font-weight: 400; font-size: 38px; line-height: 1.55; letter-spacing: 0; text-transform: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="slide">
  <img class="foto" src="bg.jpg" alt="">
  <div class="vidro">
    <blockquote>“Se é possível, não deixes para depois os laços de amor e paz que podes criar agora, em substituição às pesadas algemas do desafeto.”</blockquote>
    <cite><span class="autor">Emmanuel</span><span class="obra">por Francisco Cândido Xavier<br><span class="nb">Fonte Viva, cap. 56</span> · <span class="nb">“Renasce agora”</span></span></cite>
  </div>
  <div class="assinatura">Morada Espírita<br>Professor Lairi Hans</div>
</div>
</body>
</html>
